services:
  backend:
    build: ./backend
    init: true
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_ACCESS_TOKEN: ${APP_ACCESS_TOKEN:?Set a personal access token in .env}
      DB_PATH: /app/data/moa.db
      CORS_ORIGINS: ${FRONTEND_ORIGIN:?Set the Vercel frontend origin in .env}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
    ports:
      - "${BACKEND_BIND_ADDRESS:-127.0.0.1}:${BACKEND_PORT:-8000}:8000"
    volumes:
      - ledger_data:/app/data
  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    environment:
      API_HOST: ${API_HOST:-}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        if [ -z "$$API_HOST" ]; then
          echo "Set API_HOST in .env before enabling the https profile." >&2
          exit 1
        fi
        exec caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
volumes:
  ledger_data:
  caddy_data:
  caddy_config:
